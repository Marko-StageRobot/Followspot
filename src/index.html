<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">
    <title>SpotPlot</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1E1E1E;
        color: #FFFFFF;
        height: 100vh;
        overflow: hidden;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      /* The window has no title bar: the top bar (AppHeader) drags the window, so everything you
         can click in it opts out, or a click would grab the window instead */
      .app-header button, .app-header input, .app-header select, .app-header textarea, .app-header a,
      .app-header [role="button"], .app-header [style*="cursor: pointer"] { -webkit-app-region: no-drag; }
      /* Screens without a top bar (license, loading) get an invisible strip to drag the window by */
      .window-drag-strip { position: fixed; top: 0; left: 0; right: 0; height: 28px; -webkit-app-region: drag; z-index: 1; }
      .rich-line:empty::before { content: attr(data-placeholder); color: rgba(255,255,255,0.28); pointer-events: none; }
    </style>
  </head>
  <script>
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());
</script>
  <body>
    <div id="root"></div>
  </body>
</html>
